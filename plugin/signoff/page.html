<html lang="en">
<head>
<meta charset="utf-8">

<meta name="color-scheme" content="light dark">
<title>Signoff</title>
<style nonce="__NONCE__">
:root{color-scheme:light;--bg:#F5F5F8;--head:rgba(245,245,248,.9);--panel:#FFFFFF;--line:#E2E1EA;--line2:#CFCDDA;--text:#17151F;

@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0F0E13;--head:rgba(15,14,19,.88);--panel:#18161F;--line:#2A2733;--line2:#3A3646;--text:#EEECF3;
  --soft:#B9B5C6;--quiet:#9894A6;--accent:#B9A6FF;--sel:#241F36;--field:#121117;--box:#FF8A57;
  --boxtext:#FF9D70;--boxsoft:#2C1D18;--dim:rgba(8,6,12,.5);--btn:#B9A6FF;--btntext:#15131C;--btnoff:#2A2540;
  --btnofftext:#CFC4FF;--focus:#B9A6FF;--mark:#38BDF8;--markfill:rgba(56,189,248,.18);--seg:#1C1A24;--shadow:0 0 0 1px rgba(255,255,255,.02);
  --shadow2:0 1px 3px rgba(0,0,0,.5);--tilering:#3A3646;}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0F0E13;--head:rgba(15,14,19,.88);--panel:#18161F;--line:#2A2733;--line2:#3A3646;--text:#EEECF3;
  --soft:#B9B5C6;--quiet:#9894A6;--accent:#B9A6FF;--sel:#241F36;--field:#121117;--box:#FF8A57;
  --boxtext:#FF9D70;--boxsoft:#2C1D18;--dim:rgba(8,6,12,.5);--btn:#B9A6FF;--btntext:#15131C;--btnoff:#2A2540;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  padding:0 16px 120px;overflow-wrap:anywhere}
header{position:sticky;top:0;z-index:5;background:var(--head);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);margin:0 -16px;padding:12px 16px;display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap}
.head-text{flex:1 1 320px;min-width:0}
h1{font-size:19px;line-height:1.3;margin:0}
.intro{margin:2px 0 0;color:var(--soft);white-space:pre-line}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#status{color:var(--quiet);font-size:13px}
button{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 18px;cursor:pointer}
button.primary{background:var(--btn);border-color:var(--btn);color:var(--btntext);font-weight:650}
button:disabled{opacity:.6;cursor:default}
button:focus-visible,textarea:focus-visible,input[type=text]:focus-visible,a:focus-visible,.item:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
main{max-width:1400px;margin:0 auto}
h2.group{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:32px 0 8px}
.item{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:16px;margin:12px 0}
.item.single{grid-template-columns:minmax(0,1fr)}
@media (max-width:900px){.item{grid-template-columns:minmax(0,1fr)}}
.shots{display:flex;flex-direction:column;gap:12px;min-width:0}
figure{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.frame{position:relative;display:inline-block;align-self:flex-start;max-width:100%;line-height:0;border-radius:8px;overflow:hidden;
  border:1px solid var(--line)}
.frame img{display:block;max-width:100%;max-height:620px;width:auto;height:auto}
.overlay{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.overlay .dim{fill:var(--dim)}
.overlay .box{fill:none;stroke:var(--box);stroke-width:3}
figcaption{font-size:13px;color:var(--quiet)}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;margin:0 0 6px;width:100%}
h3{margin:0;font-size:17px;line-height:1.35}
.num{color:var(--quiet);font-weight:400;margin-right:6px}
.desc{color:var(--soft);margin:0 0 10px;white-space:pre-line}
.cost{font-size:13.5px;color:var(--quiet);margin:0 0 12px;white-space:pre-line}
.cost strong{color:var(--soft);font-weight:650;margin-right:6px}
.rec{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.03em;border:1px solid var(--line);border-radius:999px;
  padding:2px 10px;color:var(--soft);margin:0 0 10px}
.hint-many{font-size:13px;color:var(--quiet);margin:0 0 8px}
.choices{display:flex;flex-direction:column;gap:8px}
.opt{position:relative}
.opt input{position:absolute;left:13px;top:14px;margin:0;width:18px;height:18px;accent-color:var(--accent)}
.opt label{display:block;padding:10px 12px 10px 42px;border:1px solid var(--line);border-radius:10px;cursor:pointer;min-height:44px}
.opt input:checked+label{border-color:var(--accent);background:var(--sel);font-weight:600}
.opt input:focus-visible+label{outline:3px solid var(--focus);outline-offset:2px}
.opt .detail{display:block;font-weight:400;color:var(--quiet);font-size:13.5px}
.tag{display:inline-block;margin-left:8px;font-size:11.5px;font-weight:700;color:var(--accent);letter-spacing:.03em}
.clabel{display:block;margin:14px 0 4px;font-size:13.5px;color:var(--soft)}
textarea{display:block;width:100%;min-height:52px;background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;font:inherit;resize:vertical}
#free{min-height:96px}
.ftitle{display:block;font-weight:650;font-size:17px;margin:0 0 4px}
.notice{max-width:1400px;margin:12px auto 0;padding:10px 14px;border-radius:10px;border:1px solid var(--line);
  border-left:4px solid var(--box);background:var(--panel);font-weight:600;white-space:pre-line}
.page-intro{display:none}
@media (max-width:600px){.head-intro,.wide{display:none}.page-intro{display:block;margin:12px 0 0}h1{font-size:17px}}
.banner{display:none;margin:16px 0 0;padding:12px 16px;border-radius:10px;border:1px solid var(--accent);background:var(--sel)}
.banner.on{display:block}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;min-width:0;margin:18px 0 0;padding:4px 4px 0;border-bottom:1px solid var(--line)}
.tabs [role=tab]{flex:0 0 auto;white-space:nowrap;border-radius:10px 10px 0 0;border-bottom:0;margin-bottom:-1px;background:transparent;
  color:var(--soft);padding:8px 14px}
.tabs [role=tab][aria-selected=true]{background:var(--panel);color:var(--text);font-weight:650;border-bottom:1px solid var(--panel)}
.tick{color:var(--accent);margin-right:6px}
.readonly-note{margin:16px 0 0;padding:10px 14px;border-radius:10px;border:1px dashed var(--line);color:var(--soft)}
.opt input.other-text{position:static;display:block;width:calc(100% - 42px);height:auto;margin:6px 0 0 42px;background:var(--field);
  color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
input.other-text:disabled,textarea:disabled{opacity:.75}
.help-line{margin:24px 0 0;color:var(--quiet);font-size:13.5px}
button.link{border:0;background:none;color:var(--accent);padding:4px 0;text-decoration:underline}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:18px 20px;
  max-width:min(460px,calc(100vw - 32px))}
dialog::backdrop{background:var(--dim)}
dialog h2{font-size:17px;margin:0 0 10px}
dl.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0 0 16px}
dl.keys dt{white-space:nowrap}
dl.keys dd{margin:0;color:var(--soft)}
.missing{display:flex;align-items:center;justify-content:center;min-height:160px;border:1px dashed var(--line);border-radius:8px;
  color:var(--quiet);padding:16px;text-align:center}
.board-bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 0 8px}
.board-label{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:4px 10px;font-size:13px;background:var(--panel);color:var(--soft)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--sel);color:var(--text);font-weight:650}
.board-box{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:8px;max-width:100%}
.board-box iframe{display:block;border:0;transform-origin:0 0;background:transparent}
.marks{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.marks.drawing{pointer-events:auto;cursor:crosshair;touch-action:none}
.marks .mark{fill:var(--markfill);stroke:var(--mark);stroke-width:3;stroke-dasharray:7 4}
.marks .mark.selected{stroke-width:4;stroke-dasharray:none}
.marks .mark-num{fill:var(--mark);font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.mark-tools{display:flex;gap:4px 16px;flex-wrap:wrap;font-size:13.5px}
.mark-tools a{color:var(--accent)}
.mark-list .clabel{margin-top:14px}
.mark-row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;margin:6px 0}
.mark-row textarea{flex:1 1 200px;min-height:60px}
.mark-handle{padding:6px 10px;font-size:13.5px;border-color:var(--mark)}
.mark-text{margin:6px 0 0;color:var(--soft);flex:1 1 200px;white-space:pre-line}
.hint{color:var(--quiet);font-size:13.5px;margin:4px 0}
.layout.split{display:grid;grid-template-columns:minmax(240px,340px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.layout.split{grid-template-columns:minmax(0,1fr)}}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 8px}
.filters label{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--soft);flex:1 1 130px;min-width:0}
.filters input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--text);min-width:0}
.filters input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.h-count{font-size:13px;color:var(--quiet);margin:0 0 8px}
.h-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.h-entry{width:100%;text-align:left;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px}
.h-entry[aria-current=true]{border-color:var(--accent);background:var(--sel)}
.h-top{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:12.5px;color:var(--quiet)}
.h-title{font-weight:650}
.h-tab{margin-left:8px;font-weight:400;color:var(--quiet);font-size:13px}
.h-status{font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--soft)}
.st-done{color:var(--accent)}
.st-error,.h-warn{color:var(--box)}
.h-warn{font-size:12.5px}
.h-outcome{font-size:13px;color:var(--soft)}
.outcome{margin:16px 0 0;padding:10px 14px;border-radius:10px;border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--panel)}
.outcome-log{display:block;color:var(--quiet);font-size:13px}
.readonly-note.warn{border-style:solid;border-color:var(--box);color:var(--text)}
.error-text{white-space:pre-wrap;font-size:13px;color:var(--soft)}
.progress{font-size:13px;font-weight:650;color:var(--soft)}
button.primary[aria-disabled=true]{cursor:not-allowed}
.reason{font-size:13px;flex:1 0 100%;text-align:right;padding:0}
.accept-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:flex-end;margin:16px 0 0}
.accept-state{margin:0;color:var(--soft)}
.accept-state.changed{color:var(--box);font-weight:650}
button.accept-round{border-color:var(--accent);color:var(--accent);font-weight:650}
.tabs .changed-mark{color:var(--box);margin-right:6px;font-weight:700}
.summary-round{margin:20px 0 0}
.summary-round h2{font-size:16px;margin:0 0 8px}
.summary-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.summary-list li{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.summary-list li.flag{border-left:4px solid var(--box)}
.summary-choice{display:block;color:var(--soft);margin:2px 0 0}
.badge{display:inline-block;font-size:12px;font-weight:650;border:1px solid var(--line);border-radius:999px;padding:1px 8px;
  margin:4px 6px 0 0;color:var(--text)}
.summary-done{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:flex-end;margin:20px 0 0}
@media (max-width:600px){.reason{text-align:left}}
kbd{font:12.5px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border:1px solid var(--line);border-bottom-width:2px;
  border-radius:5px;padding:1px 6px;background:var(--field)}
/* ---- facelift: precise (Linear-leaning: compact, hairline, segmented tabs) ---- */
[hidden]{display:none!important}
body{font-size:14.5px;letter-spacing:-.003em}
header{padding:10px 16px;gap:6px 14px}
h1{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:650;letter-spacing:-.012em}
/* the icon in CSS: dark tile, orange frame, purple dot (img-src 'self' rules out a data: URI) */
h1::before{content:"";flex:0 0 22px;height:22px;border-radius:6px;
  background:radial-gradient(circle at 15.5px 15px,#B9A6FF 0 4.5px,transparent 5px),
    linear-gradient(#FF8A57,#FF8A57) 4px 5px/11px 2px no-repeat,linear-gradient(#FF8A57,#FF8A57) 4px 12px/11px 2px no-repeat,
    linear-gradient(#FF8A57,#FF8A57) 4px 5px/2px 9px no-repeat,linear-gradient(#FF8A57,#FF8A57) 13px 5px/2px 9px no-repeat,#15131C;
  box-shadow:0 0 0 1px var(--tilering)}
.intro{font-size:13.5px}
.head-intro{padding-left:32px}
button{border-radius:7px;padding:7px 14px;border-color:var(--line2);box-shadow:var(--shadow)}
button.primary{background:var(--btn);border-color:var(--btn);color:var(--btntext);font-weight:600}
button.primary[aria-disabled=true]{opacity:1;background:var(--btnoff);border-color:var(--btnoff);color:var(--btnofftext);box-shadow:none}
button.link{box-shadow:none}
.progress{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--soft);background:var(--seg);
  border-radius:999px;padding:3px 10px}
.progress::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.notice{border-radius:8px;border:1px solid var(--line);border-left:3px solid var(--box);background:var(--boxsoft);font-weight:550;
  font-size:13.5px;padding:8px 12px}
.tabs{display:inline-flex;max-width:100%;gap:2px;margin:16px 0 0;padding:3px;border:0;border-radius:10px;background:var(--seg)}
.tabs [role=tab]{border:0;margin:0;border-radius:8px;padding:6px 12px;font-size:13.5px;box-shadow:none;color:var(--soft)}
.tabs [role=tab][aria-selected=true]{background:var(--panel);border:0;box-shadow:var(--shadow2);color:var(--text);font-weight:600}
.tick,.tabs .changed-mark{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;font-size:10.5px;font-weight:700;
  margin-right:6px;vertical-align:middle;position:relative;top:-1px}
.tick{background:var(--accent);color:var(--panel)}
.tabs .changed-mark{background:var(--boxsoft);color:var(--boxtext);box-shadow:inset 0 0 0 1px var(--box)}
h2.group{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:650;letter-spacing:.09em;margin:26px 0 6px}
h2.group::after{content:"";flex:1;height:1px;background:var(--line)}
.item{border-radius:12px;padding:18px;gap:20px;margin:10px 0;box-shadow:var(--shadow)}
.frame,.board-box{border-radius:8px;border-color:var(--line2)}
h3{font-size:16px;font-weight:650;letter-spacing:-.01em}
.num{display:inline-block;font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--accent);background:var(--sel);
  border-radius:5px;padding:4px 6px;margin-right:8px;vertical-align:2px}
.desc{font-size:14px}
.cost{display:flex;gap:8px;align-items:baseline;font-size:13px}
.cost strong{flex:0 0 auto;white-space:nowrap;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--quiet)}
.rec{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--sel);color:var(--accent);font-size:12px;font-weight:650;
  letter-spacing:0;padding:3px 10px 3px 8px}
.rec::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.choices{gap:6px}
.opt input{top:12px;width:16px;height:16px}
.opt label{border-radius:8px;padding:8px 12px 8px 40px;min-height:40px;font-size:14px;background:var(--panel)}
.opt input:checked+label{border-color:var(--accent);background:var(--sel);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.opt .detail{font-size:13px}
.opt input.other-text{margin-left:40px;width:calc(100% - 40px);border-radius:7px}

  border-radius:4px;padding:1px 5px;vertical-align:1px}
textarea{border-radius:7px;border-color:var(--line2)}
.clabel{font-size:12.5px;font-weight:600;color:var(--quiet)}

.summary-list li:first-child{border-top:0}

  h1{font-size:16px}

  #status{order:3;flex:1 0 100%;font-size:12px}

</head>
<body>
<header>
  <div class="head-text"><h1 id="title"></h1><p class="intro head-intro" id="intro"></p></div>
  <div class="actions"><span id="status" role="status" aria-live="polite">Not saved yet</span>
    <button type="button" id="accept-all"><span class="accept"><span id="accept-short">Accept all</span><span class="wide" id="accept-rest"> recommendations</span></span><span class="undo" hidden>Undo accept all</span></button>
    <span class="progress" id="progress" hidden></span>
    <button type="button" class="primary" id="done" aria-describedby="done-reason">Done</button></div>
  <button type="button" class="link reason" id="done-reason" hidden></button>
</header>
<p class="notice" id="notice" role="note" hidden></p>
<main>
  <div class="tabs" id="tabs" role="tablist" hidden></div>
  <p class="intro page-intro" id="intro-phone"></p>
  <p class="banner" id="banner" role="alert"></p>
  <div class="layout" id="layout">
    <div class="history" id="history" hidden>

    if (t.dataset.round === undefined) return;
    var ri = Number(t.dataset.round);
    if (t.dataset.item !== undefined && (t.type === 'radio' || t.type === 'checkbox')) {
      if (t.type === 'checkbox' && t.checked) {
        // Skip stands alone: ticking it clears the other boxes, ticking another box clears it.
        document.getElementsByName(t.name).forEach(function (i) {
          if (i !== t && (t.value === SKIP || i.value === SKIP)) i.checked = false;
        });
      }
      sources[ri][t.dataset.item] = 'user';
      if (undo[ri]) {
        undo[ri] = null;
        label(false);
      }
    }
    later(ri, 250);
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.dataset.round === undefined || (t.tagName !== 'TEXTAREA' && t.type !== 'text')) return;
    if (t.classList.contains('other-text')) {
      var pick = byId(t.dataset.pick);
      if (!pick.checked) {
        pick.checked = true;
        pick.dispatchEvent(new Event('change', {bubbles: true}));
      }
    }
    later(Number(t.dataset.round), 800);
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden' && Object.keys(dirty).length && !finished) save(true);
  });

  // One Done for every editable round: save them all first, so a bad one stops before any round is final.
  function each(list, done) {
    return list.reduce(function (p, ri) {
      return p.then(function (ok) { return !ok ? false : (closed[ri] ? true : send(ri, done)); });
    }, Promise.resolve(true));
  }
  function finish() {
    if (finished) return;
    if (wizard && missingRounds().length) {  // Done is not ready: say why and go there
      status.textContent = byId('done-reason').textContent;
      byId('done-reason').focus();
      return;
    }
    doneButtons.forEach(function (b) { b.disabled = true; });
    clearTimeout(timer);
    dirty = {};
    chain = chain.then(function () { return each(editable, false); })
      .then(function (ok) { return ok && each(editable, true); });
    chain.then(function (ok) {
      if (!ok) { doneButtons.forEach(function (b) { b.disabled = false; }); return; }
      finished = true;
      acceptButton.disabled = true;
      Array.prototype.forEach.call(document.querySelectorAll('main input, main textarea, .mark-tools button, .mark-row button'), function (i) { i.disabled = true; });
      status.textContent = L.done;
      var banner = byId('banner');
      banner.textContent = L.doneBanner;
      banner.classList.add('on');
      window.scrollTo(0, 0);
    });
  }
  doneButton.addEventListener('click', finish);

  // Keyboard shortcuts. They never act while a text field has focus or a modifier key is held, so typing,
  // browser shortcuts and screen reader commands keep working.
  var help = byId('help');
  [[['1–9'], L.kPick], [['j', 'k'], L.kMove], [['←', '→'], L.kTabs], [['←', '↑', '→', '↓'], L.kMark],
    [['Ctrl', 'Enter'], L.kAccept], [['?'], L.kHelp],
    [['Esc'], L.kClose]].forEach(function (row) {
    var dt = el('dt');
    row[0].forEach(function (k, i) {
      if (i) dt.append(' ');
      dt.append(el('kbd', '', k));
    });
    help.querySelector('#help-keys').append(dt, el('dd', '', row[1]));
  });
  function openHelp() { if (!help.open) help.showModal(); }
  byId('help-open').addEventListener('click', openHelp);
  byId('help-close').addEventListener('click', function () { help.close(); });
  function typing(t) {
    return !!t && (t.isContentEditable || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT'
      || (t.tagName === 'INPUT' && t.type !== 'radio' && t.type !== 'checkbox'));
  }
  function focusItem(card) {
    var target = card.querySelector('input:checked:not(:disabled)') || card.querySelector('input:not(:disabled)') || card;
    target.focus();
    card.scrollIntoView({block: 'nearest'});
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !e.altKey && !historyMode && !typing(e.target) && !help.open) {
      e.preventDefault();
      if (!wizard) finish();
      else if (active !== SUMMARY) acceptRound(active);
      else finish();
      return;
    }
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || typing(e.target) || help.open) return;
    if (e.key === '?') {
      e.preventDefault();
      openHelp();
      return;
    }
    var panel = byId('panel-' + active);
    if (!panel) return;
    var cards = Array.prototype.slice.call(panel.querySelectorAll('.item[data-item]'));
    var current = e.target.closest ? e.target.closest('.item[data-item]') : null;
    var at = cards.indexOf(current);
    if (e.key === 'j' || e.key === 'k') {
      var next = at < 0 ? 0 : at + (e.key === 'j' ? 1 : -1);
      if (next >= 0 && next < cards.length) {
        e.preventDefault();
        focusItem(cards[next]);
      }
      return;
    }
    if (/^[1-9]$/.test(e.key) && current) {
      var input = current.querySelectorAll('input[type=radio], input[type=checkbox]')[Number(e.key) - 1];
      if (!input || input.disabled) return;
      e.preventDefault();
      input.checked = input.type === 'radio' ? true : !input.checked;
      input.focus();
      input.dispatchEvent(new Event('change', {bubbles: true}));
    }
  });

  if (!historyMode) {
    showRound(active);
    refresh();
  }
})();
</script>
</body>
</html>
